# Self-contained Girth stack for one VPS: Postgres, S3-compatible storage
# (MinIO), the API and the web app. TLS comes from a front proxy:
#   - default: the host's shared "edge" Caddy (external docker network "edge");
#     add a site block there pointing at girth-staging-web-1:80
#   - standalone: `--profile standalone` adds this stack's own Caddy on 80/443
#
#   cp deploy/.env.staging.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env up -d --build
name: girth-staging

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: girth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: girth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U girth -d girth']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/minio/health/live || mc ready local']
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc version enable local/${S3_BUCKET} || true"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://girth:${POSTGRES_PASSWORD}@postgres:5432/girth
      SESSION_SECRET: ${SESSION_SECRET}
      AUDIT_SAMPLING_SALT: ${AUDIT_SAMPLING_SALT}
      WEB_ORIGINS: https://${GIRTH_DOMAIN}
      PUBLIC_TREE_BASE_URL: https://${GIRTH_DOMAIN}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@girth.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      LOG_LEVEL: info
    expose:
      - '4000'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: ${APP_ENV:-staging}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'
    networks:
      - default
      - edge

  caddy:
    profiles: ['standalone']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      GIRTH_DOMAIN: ${GIRTH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

networks:
  default:
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge}

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
