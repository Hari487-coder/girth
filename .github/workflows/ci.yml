name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: girth
          POSTGRES_PASSWORD: girth
          POSTGRES_DB: girth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U girth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: girth
          MINIO_ROOT_PASSWORD: girth-minio
          MINIO_DEFAULT_BUCKETS: girth-test
        ports: ['9000:9000']
    env:
      DATABASE_URL_TEST: postgresql://girth:girth@localhost:5432/girth_test
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: girth-test
      S3_TEST_ACCESS_KEY: girth
      S3_TEST_SECRET_KEY: girth-minio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Build domain
        run: npm run build -w packages/domain
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm run test -w packages/domain
      - name: API tests (acceptance, authorisation matrix, abuse, storage)
        run: npm run test -w apps/api
      - name: Build API
        run: npm run build -w apps/api
      - name: Build web
        run: npm run build -w apps/web

  images:
    # Proves the production containers build from a clean checkout.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: girth-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: girth-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
