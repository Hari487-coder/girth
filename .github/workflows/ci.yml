name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: girth
          POSTGRES_PASSWORD: girth
          POSTGRES_DB: girth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U girth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://girth:girth@localhost:5432/girth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Build domain
        run: npm run build -w packages/domain
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm run test -w packages/domain
      - name: API acceptance tests
        run: npm run test -w apps/api
      - name: Build API
        run: npm run build -w apps/api
      - name: Build web
        run: npm run build -w apps/web
