# Render blueprint for the STAGING API. Create the Postgres instance and set the
# secret env vars in the Render dashboard; nothing secret lives in this file.
services:
  - type: web
    name: girth-api-staging
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build -w packages/domain && npm run build -w apps/api
    preDeployCommand: npm run db:migrate -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: girth-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUDIT_SAMPLING_SALT
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: PUBLIC_TREE_BASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: LOG_LEVEL
        value: info

databases:
  - name: girth-staging-db
    plan: basic-256mb
    postgresMajorVersion: '17'
